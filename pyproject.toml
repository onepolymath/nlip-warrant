[project]
name = "nlip-warrant"
version = "0.1.0"
description = "Signed, attenuable, expiring and revocable delegation warrants enforced at NLIP (ECMA-430) agent boundaries."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuf Ojo Raifu" }]
requires-python = ">=3.11"
keywords = ["nlip", "ecma-430", "ecma-434", "ai-agents", "capabilities", "delegation", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=43",
  "pydantic>=2.9,<3",
  "nlip-sdk>=0.1.3,<0.2",
]

[project.optional-dependencies]
server = ["nlip-server>=0.1.3,<0.2", "httpx>=0.27", "uvicorn>=0.30"]

[project.scripts]
nlip-warrant = "nlip_warrant.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "nlip-server>=0.1.3,<0.2",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlip_warrant"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "PT", "TID", "ANN", "C4", "PIE", "RET"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN", "S105", "S106"]
"eval/**" = ["S311", "T201", "PLR0915"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "eval"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["nlip_sdk.*", "nlip_server.*", "matplotlib.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["nlip_warrant"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]
